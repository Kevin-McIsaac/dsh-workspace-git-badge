<svg xmlns="http://www.w3.org/2000/svg" width="780" height="188" viewBox="0 0 780 188" role="img"
     aria-label="Dark-mode input chip: a push glyph before a linked worktree on feat/worktree-aware-chip with a passing pull request 18, above a main checkout with sync and file counts, a fix-CI glyph and a failing pull request 142">
  <style>
    .panel { fill:#1b1e21; stroke:#2b3034; stroke-width:1 }
    .bar   { fill:#202529; stroke:#2b3034; stroke-width:1 }
    .label { font:11px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#7d858c; letter-spacing:.05em }
    .mono  { font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#aab1b7 }
    .monob { font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#e6e8ea }
    .cap   { font:12px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#7d858c }
    .ok { fill:#3fbf7f } .warn { fill:#d9a227 } .err { fill:#ef5f63 } .biz { fill:#4c8dff }
  </style>
  <rect class="panel" x="0.5" y="0.5" width="779" height="187" rx="12"/>

  <!-- this session: the conversation works in a linked worktree, so the chip follows it -->
  <text class="label" x="26" y="34">LINKED WORKTREE · THE CONVERSATION'S OWN DIRECTORY IS THE MAIN CHECKOUT</text>
  <rect class="bar" x="26" y="44" width="728" height="34" rx="8"/>
  <text class="monob biz" x="40" y="67">↑</text>
  <text class="monob" x="60" y="66">feat/worktree-aware-chip</text>
  <text class="mono" x="250" y="66">PR#18 ✓</text>
  <text class="cap" x="334" y="66">← the glyph is the one action; the card's worktree row names the tree</text>

  <!-- a main checkout, for contrast: a failing check, counts, its own glyph -->
  <text class="label" x="26" y="112">MAIN CHECKOUT</text>
  <rect class="bar" x="26" y="122" width="728" height="34" rx="8"/>
  <text class="monob err" x="40" y="145">✗</text>
  <text class="monob" x="60" y="144">main</text>
  <text class="mono" x="110" y="144">↑0 ↓2 ✎3</text>
  <text class="mono" x="212" y="144">PR#142 ✗</text>
  <text class="cap" x="296" y="144">← glyph colour = severity (red: failing checks)</text>

  <text class="cap" x="26" y="178">Icon = the node half's action token, painted by severity (red error, amber warn, green success, blue routine). No token, no icon.</text>
</svg>
