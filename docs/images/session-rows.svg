<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" role="img"
     aria-label="Sidebar session rows: one asking you to fix CI in red, one asking you to merge in green, and one with nothing to do showing no token at all">
  <style>
    .panel { fill:#ffffff; stroke:#e5e7eb; stroke-width:1 }
    .head  { font:12px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#9ea7ad }
    .title { font:13px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#1f2328 }
    .time  { font:12px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#9ea7ad }
    .act   { font:12px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-weight:600 }
    .ok { fill:#30a46c } .err { fill:#e5484d } .dot { fill:#e5e7eb }
    .cap { font:12px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#9ea7ad }
  </style>
  <rect class="panel" x="0.5" y="0.5" width="759" height="195" rx="12"/>
  <text class="head" x="24" y="32">dsh-workspace-git-badge</text>
  <line x1="24" y1="44" x2="736" y2="44" stroke="#f0f1f2"/>

  <circle class="dot" cx="40" cy="68" r="4"/><text class="title" x="56" y="73">Ask about the parser…</text>
  <text class="act err" x="620" y="73">fix CI</text><text class="time" x="690" y="73">11m</text>

  <circle class="dot" cx="40" cy="104" r="4"/><text class="title" x="56" y="109">Ship the action token…</text>
  <text class="act ok" x="612" y="109">merge</text><text class="time" x="690" y="109">11m</text>

  <circle class="dot" cx="40" cy="140" r="4"/><text class="title" x="56" y="145">Read the changelog…</text>
  <text class="time" x="690" y="145">2h</text>

  <text class="cap" x="24" y="180">Nothing to do → nothing shown. The token floats right, heavier than the time, coloured by how much it needs you.</text>
</svg>
