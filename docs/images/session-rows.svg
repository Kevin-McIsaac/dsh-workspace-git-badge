<svg xmlns="http://www.w3.org/2000/svg" width="780" height="212" viewBox="0 0 780 212" role="img"
     aria-label="Dark-mode sidebar session rows: a green tick in the leading cell for a merge-ready pull request, a red cross for failing CI, and an in-sync disc when there is nothing to do">
  <style>
    .panel { fill:#1b1e21; stroke:#2b3034; stroke-width:1 }
    .head  { font:12px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#7d858c }
    .title { font:13px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#e6e8ea }
    .time  { font:12px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#7d858c }
    .act   { font:13px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-weight:600 }
    .ok { fill:#3fbf7f } .err { fill:#ef5f63 }
    .cap { font:12px -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:#7d858c }
  </style>
  <rect class="panel" x="0.5" y="0.5" width="779" height="211" rx="12"/>
  <text class="head" x="26" y="32">dsh-workspace-git-badge</text>
  <line x1="26" y1="44" x2="754" y2="44" stroke="#262b2f"/>

  <text class="act ok" x="36" y="75">&#x2713;</text><text class="title" x="58" y="75">Session badge follows the worktree…</text>
  <text class="time" x="712" y="75">11m</text>

  <text class="act err" x="36" y="113">&#x2717;</text><text class="title" x="58" y="113">Fix the sidebar blanking the region…</text>
  <text class="time" x="712" y="113">2h</text>

  <circle cx="42" cy="146" r="5" fill="#3fbf7f"/><text class="title" x="58" y="151">Docs: first pass at the READMEs…</text>
  <text class="time" x="712" y="151">3h</text>

  <text class="cap" x="26" y="188">Leading icon = the action (&#x2713; merge-ready, &#x2717; failing CI); the disc means in sync: green when merged, amber when not. Hover for the word and reason.</text>
</svg>
